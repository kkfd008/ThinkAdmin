<form action="{:sysuri()}" method="post" data-auto="true" class="layui-form layui-card" data-table-id="ShopStockRecordTable">

    <div class="layui-card-body padding-left-40">

        <label class="layui-form-item relative block">
            <span class="help-label"><b>{:lang('选择商品')}</b>Product</span>
            <select class="layui-select" name="product_id" required vali-name="{:lang('商品')}">
                <option value="">{:lang('请选择商品')}</option>
                {foreach $products as $product}
                <option value="{$product.id}"{if input('product_id') eq $product.id} selected{/if}>{$product.code} - {$product.name}</option>
                {/foreach}
            </select>
        </label>

        <label class="layui-form-item relative block">
            <span class="help-label"><b>{:lang('盘点数量')}</b>Stock</span>
            <input type="number" min="0" class="layui-input" name="stock" value="" required vali-name="{:lang('盘点数量')}" placeholder="{:lang('请输入盘点后的库存数量')}">
        </label>

        <label class="layui-form-item relative block">
            <span class="help-label"><b>{:lang('备注')}</b>Remark</span>
            <textarea name="remark" class="layui-textarea" placeholder="{:lang('请输入备注')}"></textarea>
        </label>

    </div>

    <div class="hr-line-dashed"></div>

    <div class="layui-form-item text-center">
        <button class="layui-btn" type='submit'>{:lang('确认盘点')}</button>
        <button class="layui-btn layui-btn-danger" type='button' data-confirm="{:lang('确定要取消吗？')}" data-close>{:lang('取消')}</button>
    </div>

</form>
