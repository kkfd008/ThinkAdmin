<form class="layui-form layui-form-pane form-search" action="{:sysuri()}" onsubmit="return false" method="get" autocomplete="off">
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">商品名称</label>
        <div class="layui-input-inline"><input name="product_name" value="{$get.product_name|default=''}" placeholder="请输入" class="layui-input"></div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">货号(条码)</label>
        <div class="layui-input-inline"><input name="product_barcode" value="{$get.product_barcode|default=''}" placeholder="请输入" class="layui-input"></div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">更新时间</label>
        <div class="layui-input-inline"><input data-date-range name="update_at" value="{$get.update_at|default=''}" placeholder="请选择" class="layui-input"></div>
    </div>
    <div class="layui-form-item layui-inline">
        <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
    </div>
</form>
