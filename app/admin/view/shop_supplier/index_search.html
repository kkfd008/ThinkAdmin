<form class="layui-form layui-form-pane form-search" action="{:sysuri()}" onsubmit="return false" method="get" autocomplete="off">
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">供应商ID</label>
        <div class="layui-input-inline"><input name="code" value="{$get.code|default=''}" placeholder="请输入供应商ID" class="layui-input"></div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">供应商名称</label>
        <div class="layui-input-inline"><input name="name" value="{$get.name|default=''}" placeholder="请输入供应商名称" class="layui-input"></div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">供应商电话</label>
        <div class="layui-input-inline"><input name="phone" value="{$get.phone|default=''}" placeholder="请输入供应商电话" class="layui-input"></div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">创建时间</label>
        <div class="layui-input-inline"><input data-date-range name="create_at" value="{$get.create_at|default=''}" placeholder="请选择" class="layui-input"></div>
    </div>
    <div class="layui-form-item layui-inline">
        <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
    </div>
</form>
