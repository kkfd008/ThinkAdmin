<form class="layui-form layui-form-pane form-search" action="{:sysuri()}" onsubmit="return false" method="get" autocomplete="off">
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">供应商名称</label>
        <div class="layui-input-inline"><input name="supplier_name" value="{$get.supplier_name|default=''}" placeholder="请输入" class="layui-input"></div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">备注</label>
        <div class="layui-input-inline"><input name="remark" value="{$get.remark|default=''}" placeholder="请输入" class="layui-input"></div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">库单时间</label>
        <div class="layui-input-inline"><input data-date-range name="delivery_date" value="{$get.delivery_date|default=''}" placeholder="请选择" class="layui-input"></div>
    </div>
    <div class="layui-form-item layui-inline">
        <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
    </div>
</form>
